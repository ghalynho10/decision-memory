[project]
name = "decision-memory"
version = "0.1.0"
description = "Answer why a project is built the way it is, with cited answers backed by its decision records."
readme = "README.md"
authors = [
    { name = "Ghaly Nicolas Jules", email = "mghalynho@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.4",
    "typer>=0.27.1",
]

[project.scripts]
decision-memory = "decision_memory.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that call real external services (OpenAI API, live Chroma); excluded from the default unit run.",
]
testpaths = ["tests"]
